services:
  # One-shot: makes the bind-mounted data folders writable by irisowner (uid 51773).
  init-perms:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - ./data:/data
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/in /data/out /data/error /data/archive /data/replay &&
        chmod 0777 /data/in /data/out /data/error /data/archive /data/replay &&
        find /data/replay -type f -exec chmod 0666 {} +

  iris:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init-perms:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
    ports:
      - 1972:1972
      - 52773:52773
    volumes:
      - ./:/home/irisowner/dev
    # The base image check (/irisHealth.sh) fails on this EAP build because the instance
    # status is "alert" (startup errors unrelated to the app). Healthy here means:
    # LabTriage.Production is running (state 1) in IRISAPP. "$$" escapes "$" for compose.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf '%s\n'
          'Set sc=##class(Ens.Director).GetProductionStatus(.n,.s) Write !,"PRODSTATE ",+sc," ",$$Get(n)," ",$$Get(s),!'
          'Halt'
          | iris session IRIS -U IRISAPP
          | grep -qx 'PRODSTATE 1 LabTriage.Production 1'
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
